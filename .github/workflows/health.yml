# kula — ask kula's live Supabase project every morning whether it is still well.
#
# It needs no secret: the key in web/config.js is the public one, protected by
# the row-level rules and not by being hidden.
#
# What makes this worth having is not uptime. It is the quieter kind of wrong:
# a database whose content vanished, or a project that is a SQL file behind.
# health.mjs exits non-zero for those, and a failed run sends the email.

name: health

on:
  schedule:
    # 06:20 UTC daily, after the scheduled jobs inside the database have run.
    - cron: "20 6 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ask the database how it is
        working-directory: backend
        run: node tools/health.mjs
