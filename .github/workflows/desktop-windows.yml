# kula for the desktop on Windows: the NSIS installer kula-windows-x64.exe built once on windows-2022,
# then smoke-tested on windows-2022 and windows-2025 (desktop/tools/windows-smoke.ps1: the installer as
# shipped, first launch with llama.cpp, the chat page, a small model (Qwen3 0.6B, 639 MB from
# huggingface) loaded here and answering on the cpu, quit, llama.cpp's cuda pick with a fake
# nvidia-smi.exe (about 0.65 GB more), a home with odd characters in its path, the uninstaller; hence
# the smoke job's 45 minutes). Pushes to kula-main do not run it; by hand (workflow_dispatch) or a push
# on any other branch that touches the desktop app or kula-node. Never on tags and never publishes:
# the files stay an artifact of the run.
name: desktop-windows

on:
  workflow_dispatch:
  push:
    branches-ignore: [kula-main]
    tags-ignore: ['**']
    paths:
      - 'desktop/**'
      - '!desktop/tools/linux-smoke.sh'
      - 'node/src/**'
      - 'node/package*.json'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  CI: 1

jobs:
  build:
    name: build (nsis, x64)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the smoke script must parse: a syntax error fails here in a minute, not after the build
      - name: parse windows-smoke.ps1
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $file = Join-Path $PWD 'desktop\tools\windows-smoke.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            foreach ($pe in $parseErrors) { Write-Output "line $($pe.Extent.StartLineNumber): $($pe.Message)" }
            exit 1
          }
          Write-Output "$file parses"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            node/package-lock.json
            desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: node
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - name: dist:win
        run: npm run dist:win
        working-directory: desktop
      - name: the installer and its sum
        shell: bash
        working-directory: desktop/release
        run: |
          ls -la
          [ -f kula-windows-x64.exe ] || { echo "missing kula-windows-x64.exe"; exit 1; }
          sha256sum kula-windows-x64.exe > sha256sums-windows.txt
          cat sha256sums-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kula-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/kula-windows-x64.exe
            desktop/release/sha256sums-windows.txt

  smoke:
    name: smoke (${{ matrix.runner }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kula-windows
          path: ${{ runner.temp }}/kula-windows
      # nothing is installed beforehand: the script measures the runner as it comes
      - name: smoke
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUT: ${{ runner.temp }}/smoke
        run: |
          $ErrorActionPreference = 'Continue'
          $null = New-Item -ItemType Directory -Force -Path $env:SMOKE_OUT
          pwsh -NoProfile -File desktop/tools/windows-smoke.ps1 (Join-Path $env:RUNNER_TEMP 'kula-windows') 2>&1 | Tee-Object -FilePath (Join-Path $env:SMOKE_OUT 'smoke-output.txt')
          $rc = [int]$LASTEXITCODE
          # the script also writes its own exit code at its end: no file means it never got there
          $f = Join-Path $env:SMOKE_OUT 'smoke-exit.txt'
          if (Test-Path -LiteralPath $f) { $rc = [Math]::Max($rc, [int]((Get-Content -Raw -LiteralPath $f).Trim())) } else { $rc = 1 }
          Write-Output "smoke exit $rc"
          exit $rc
      - name: summary
        if: ${{ always() }}
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          $f = Join-Path $env:SMOKE_OUT 'smoke-output.txt'
          $lines = @()
          if (Test-Path -LiteralPath $f) { $lines = @(Get-Content -LiteralPath $f | Where-Object { $_ -match '^(CHECK|FACT) ' }) }
          if ($lines.Count -eq 0) { $lines = @('(no output)') }
          $md = @("### desktop-windows smoke ($env:RUNNER_LABEL)", '```') + $lines + @('```')
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $md -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: smoke-${{ matrix.runner }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/smoke/*.txt
            ${{ runner.temp }}/smoke/*.log
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/*.html
