# fly launch --no-deploy --copy-config  (then: fly deploy)
# the relay is stateless: one small machine per region is plenty; https/wss end at fly's edge.
app = "kula-relay"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  RELAY_CODE_TTL_S = "600"
  RELAY_MAX_MB = "1024"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
