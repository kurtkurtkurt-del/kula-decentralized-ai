plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kulavoice'
version = '0.1.0'

// Talk mode's native side (docs/VOICE.md): no native code, framework APIs only
// (MediaSession, AudioManager, NotificationListenerService, AlarmClock and share intents).
android {
  namespace "expo.modules.kulavoice"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}
