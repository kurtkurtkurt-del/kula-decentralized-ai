# kula-node 0.1.0: generated by node/tools/manifests.mjs, do not edit by hand.
# nfpm package --packager deb --target dist/pack/   (after node tools/pack.mjs --target linux-${GOARCH})
# tools/deb.mjs makes the same .deb without nfpm.
name: kula-node
arch: ${GOARCH}
platform: linux
version: 0.1.0
section: utils
priority: optional
maintainer: kurtkurtkurt-del <noreply@github.com>
description: Make this computer a worker in a kula phone cluster.
vendor: kula
homepage: https://github.com/kurtkurtkurt-del/kula-decentralized-ai
license: MIT
contents:
  - src: ./dist/pack/kula-node-0.1.0-linux-${GOARCH}
    dst: /usr/bin/kula-node
    file_info:
      mode: 0755
