  <main id="content" tabindex="-1" class="fb pp">
    <h1 class="page-title" data-i18n="passport.h1">passport.</h1>

    <!-- the one number: everything together -->
    <p class="pp-total"><span id="pp-tps">…</span> <span class="pp-unit">tok/s</span></p>
    <p class="pp-under" id="pp-under" data-i18n="passport.measuring">measuring this computer…</p>

    <!-- the devices, one line each -->
    <div class="pp-list" id="pp-list"></div>

    <!-- another device: its passport, pasted (the app: copy json) -->
    <div class="pp-add">
      <input class="account-field set-wide" id="pp-paste" type="text" placeholder="paste a device's passport here" data-i18n-attr="placeholder:passport.paste" autocomplete="off" spellcheck="false" />
      <button class="account-button" id="pp-addbtn" type="button" data-i18n="passport.add">add</button>
      <span class="account-status" id="pp-status"></span>
    </div>

    <!-- this computer as a code, for the phone -->
    <div class="pp-code" id="pp-code" hidden>
      <canvas id="pp-canvas" width="160" height="160" aria-label="this computer's passport as a qr code" data-i18n-attr="aria-label:passport.qr.alt"></canvas>
      <p class="pp-hint" data-i18n="passport.qr.hint">the phone: passport → connect</p>
    </div>
