<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>kula</title>
<style>
  :root { --bg: #f7f7f4; --ink: #18241c; --mute: #5f6b62; --line: rgba(24,36,28,.14); --accent: #2f6b45; --bad: #b4513a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121714; --ink: #e8efe9; --mute: #9aa79e; --line: rgba(232,239,233,.14); --accent: #7cc296; --bad: #e08a74; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: grid; place-items: center; }
  main { width: min(560px, 100% - 32px); }
  h1 { font-size: 44px; letter-spacing: -.02em; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--mute); margin: 0 0 28px; }
  #step { font-weight: 500; margin: 0 0 10px; display: flex; gap: 10px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; flex: none; }
  .bad .dot { background: var(--bad); animation: none; }
  @keyframes pulse { 50% { opacity: .25; } }
  pre { margin: 0; height: 220px; overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--mute); white-space: pre-wrap; }
  .row { display: none; gap: 8px; margin-top: 14px; }
  .bad .row { display: flex; }
  a.btn { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  a.btn.main { background: var(--accent); border-color: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<main id="m">
  <h1>kula</h1>
  <p class="sub">your phones, tablets and computers as one local ai.</p>
  <p id="step"><span class="dot"></span><span id="t">starting</span></p>
  <pre id="log"></pre>
  <div class="row"><a class="btn main" href="#retry" onclick="again()">try again</a><a class="btn" href="#skip">continue without it</a></div>
</main>
<script>
  const log = document.getElementById('log');
  window.step = (t) => { document.getElementById('m').classList.remove('bad'); document.getElementById('t').textContent = t; };
  window.line = (t) => { log.textContent += t + '\n'; log.scrollTop = log.scrollHeight; };
  window.failed = (t) => { document.getElementById('m').classList.add('bad'); document.getElementById('t').textContent = t; };
  function again() { setTimeout(() => { location.hash = ''; }, 50); }
</script>
</body>
</html>
